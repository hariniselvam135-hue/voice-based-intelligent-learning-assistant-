```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-Based Smart Learning Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 750px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .voice-button {
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: #667eea;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .voice-button:hover {
            background: #4f5fc5;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        .ask-button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #28a745;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .ask-button:hover {
            background: #218838;
        }

        .box {
            margin-top: 25px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 12px;
            text-align: left;
        }

        .box h3 {
            margin-top: 0;
            color: #444;
        }

        #status {
            color: #777;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎓 Voice-Based Smart Learning Assistant</h1>

        <p class="subtitle">
            Interactive AI-powered learning support system
        </p>

        <button class="voice-button" onclick="startVoice()">
            🎤 Start Speaking
        </button>

        <p id="status">
            Click the microphone and ask your question.
        </p>

        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Type your question here..."
            >

            <button class="ask-button" onclick="askQuestion()">
                Ask
            </button>

        </div>

        <div class="box">

            <h3>🗣️ Your Question</h3>

            <p id="userQuestion">
                Your question will appear here.
            </p>

        </div>

        <div class="box">

            <h3>🤖 Assistant Response</h3>

            <p id="answer">
                Waiting for your question...
            </p>

        </div>

    </div>


    <script>

        function askQuestion() {

            const question =
                document.getElementById("question").value.trim();

            const answer =
                document.getElementById("answer");

            const userQuestion =
                document.getElementById("userQuestion");

            const status =
                document.getElementById("status");

            if (question === "") {

                answer.innerText =
                    "Please enter or speak a question.";

                return;
            }

            userQuestion.innerText = question;

            status.innerText =
                "Processing your question...";

            fetch("/ask", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })

            })

            .then(response => response.json())

            .then(data => {

                answer.innerText = data.answer;

                status.innerText =
                    "Response generated successfully.";

                const speech =
                    new SpeechSynthesisUtterance(data.answer);

                speech.lang = "en-US";

                window.speechSynthesis.speak(speech);

            })

            .catch(error => {

                answer.innerText =
                    "Unable to connect to the server.";

                status.innerText =
                    "Error occurred.";

            });
        }


        function startVoice() {

            const SpeechRecognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;

            if (!SpeechRecognition) {

                alert(
                    "Voice recognition is not supported. Please use Google Chrome or Microsoft Edge."
                );

                return;
            }

            const recognition =
                new SpeechRecognition();

            recognition.lang = "en-US";

            recognition.continuous = false;

            recognition.interimResults = false;

            document.getElementById("status").innerText =
                "🎙️ Listening... Please speak.";

            recognition.start();

            recognition.onresult = function(event) {

                const voiceText =
                    event.results[0][0].transcript;

                document.getElementById("question").value =
                    voiceText;

                document.getElementById("userQuestion").innerText =
                    voiceText;

                document.getElementById("status").innerText =
                    "Voice recognized successfully.";

                askQuestion();
            };

            recognition.onerror = function() {

                document.getElementById("status").innerText =
                    "Unable to recognize your voice. Please try again.";

            };
        }

    </script>

</body>
</html>
